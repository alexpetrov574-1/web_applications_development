<!doctype html>
<html>
  <head>
    <title>ЛАБОРАТОРНАЯ №1</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <h1>Лабораторная работа №1. - Классы.</h1>
    <form id="form-student" onsubmit="execute(event)">
      <p>Фамилия: <input type="text" id="surname" /></p>
      <p>Имя: <input type="text" id="name" /></p>
      <p>Отчество: <input type="text" id="patronymic" /></p>
      <p>Дата рождения: <input type="date" id="dateOfBirth" /></p>
      <p>
        Номер телефона:
        <input
          type="tel"
          pattern="^\+79\d{2}\d{3}\d{2}\d{2}$"
          placeholder="+79999999999"
          id="phoneNumber"
        />
      </p>
      <p>
        Адрес почты:
        <input
          type="email"
          pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"
          id="email"
          placeholder="example@mail.com"
        />
      </p>
      <button type="submit">Добавить</button>
    </form>
    <table border="1" color="black" id="tableOfPersons">
      <tr>
        <th>Фамилия</th>
        <th>Имя</th>
        <th>Отчество</th>
        <th>Дата рождения</th>
        <th>Номер телефона</th>
        <th>Адрес почты</th>
      </tr>
      <tbody></tbody>
    </table>
    <script src="person.js"></script>
    <script src="main.js"></script>
  </body>
</html>
