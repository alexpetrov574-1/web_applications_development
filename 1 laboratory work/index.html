<!doctype html>
<html>
  <head>
    <title>ЛАБОРАТОРНАЯ №1</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <h1>Лабораторная работа №1. - Классы.</h1>
    <form>
      <p>Фамилия: <input type="text" name="surname" /></p>
      <p>Имя: <input type="text" name="name" /></p>
      <p>Отчество: <input type="text" name="patronymic" /></p>
      <p>Дата рождения: <input type="date" name="dateOfBirth" /></p>
      <p>
        Номер телефона:
        <input
          type="tel"
          pattern="^\+7\(9\d{2}\)\d{3}-\d{2}-\d{2}$"
          placeholder="+7(999)999-99-99"
          name="phoneNumber"
        />
      </p>
      <p>
        Адрес почты:
        <input type="email" pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" name="email" />
      </p>
      <input type="submit" value="Добавить" />
    </form>
    <table border="1" color="black">
      <tr>
        <th>Фамилия</th>
        <th>Имя</th>
        <th>Отчество</th>
        <th>Дата рождения</th>
        <th>Номер телефона</th>
        <th>Адрес почты</th>
      </tr>
      <tbody></tbody>
    </table>
  </body>
</html>
